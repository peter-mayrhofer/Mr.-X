name: Android-APK

# Baut die Android-App (docs/ANDROID-APK.md).
# - bei Änderungen an der App: Test-Build (unsigniert) als Artefakt zum Ausprobieren
# - bei einem Versions-Tag (z. B. v2.0.0) oder von Hand: signierte APK, als Release veröffentlicht
on:
  push:
    # Branches und Tags getrennt nennen – nur „tags“ allein würde Branch-Pushes ausschließen
    branches: ["**"]
    tags: ["v*"]
    paths: ["app/**", "shared/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNED: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Adresse des Spiel-Servers fest in die App (Repository-Variable MRX_API_URL, docs/ANDROID-APK.md)
      - run: npm -w app run build
        env:
          VITE_API_URL: ${{ vars.MRX_API_URL || 'https://mister-x.mr-x-ooe.workers.dev' }}
      - run: npx cap sync android
        working-directory: app

      - name: Signier-Schlüssel
        if: env.SIGNED == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 fehlt – siehe docs/ANDROID-APK.md"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/mrx.jks"
          echo "MRX_KEYSTORE_FILE=$RUNNER_TEMP/mrx.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: app/android
        env:
          MRX_VERSION_CODE: ${{ github.run_number }}
          MRX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MRX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MRX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ]; then ./gradlew assembleRelease --no-daemon; cp app/build/outputs/apk/release/app-release.apk ../../mister-x.apk
          else ./gradlew assembleDebug --no-daemon; cp app/build/outputs/apk/debug/app-debug.apk ../../mister-x-test.apk; fi

      - uses: actions/upload-artifact@v4
        with:
          name: mister-x-apk
          path: mister-x*.apk
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mister-x.apk
          body: "Android-App „Mister X – Rote Falken“. Installation: docs/ANDROID-APK.md"
