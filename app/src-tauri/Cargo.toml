[package]
name = "mister-x"
version = "2.0.0-beta.1" # nur Platzhalter – maßgeblich ist app/package.json (tauri.conf.json: "version")
description = "Mister X – Desktop-Hülle für die Live-Web-App"
edition = "2021"
rust-version = "1.90" # tauri-plugin-window-state verlangt mindestens 1.90

[lib]
name = "mister_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[features]
# Für Release-Builds bzw. ohne Dev-Server – NICHT entfernen (setzt `tauri build` selbst)
custom-protocol = ["tauri/custom-protocol"]

# Kleiner Installer statt schnellem Kompilieren
[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
panic = "abort"
